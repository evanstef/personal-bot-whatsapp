name: CI/CD

on:
  push:
    branches: [master]

# least-privilege: token workflow read-only (cukup buat checkout)
permissions:
  contents: read

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build & push bot WA
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/personal-bot-whatsapp:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/personal-bot-whatsapp:sha-${{ github.sha }}
          cache-from: type=gha,scope=wa-bot
          cache-to: type=gha,mode=max,scope=wa-bot

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: Pull image + up (service wa-bot saja)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/job-match
            # service lain di-set :latest cuma supaya compose bisa di-parse; tidak disentuh
            export API_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/job-match-api:latest
            export WEB_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/job-match-web:latest
            export SCRAPER_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/job-match-scraper:latest
            export WA_BOT_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/personal-bot-whatsapp:sha-${{ github.sha }}
            docker compose --env-file .env -f docker-compose.prod.yml pull wa-bot
            docker compose --env-file .env -f docker-compose.prod.yml up -d wa-bot
            # -a: buang image bertag yang tak dipakai container, bukan cuma yang dangling.
            # Tanpa -a, tiap deploy menumpuk image lama selamanya (prune-nya nol sasaran).
            # Versi lama tetap ada di Docker Hub, jadi rollback masih bisa lewat pull.
            # kegagalan bersih-bersih tidak boleh menjatuhkan deploy yang sudah sukses
            docker image prune -af || true
